name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Static parity, unit, and CLI suites. None need an AFFiNE instance:
      # the CLI suite drives the real binary against a stub GraphQL server.
      - run: npm test
